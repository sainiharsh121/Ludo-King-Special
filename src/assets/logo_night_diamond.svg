      <circle cx="2" cy="2" r="0.6" fill="#b21919" /><circle cx="4" cy="2" r="0.6" fill="#b21919" /><circle cx="2" cy="4" r="0.6" fill="#b21919" /><circle cx="4" cy="4" r="0.6" fill="#b21919" />
      <circle cx="11" cy="2" r="0.6" fill="#45901A" /><circle cx="13" cy="2" r="0.6" fill="#45901A" /><circle cx="11" cy="4" r="0.6" fill="#45901A" /><circle cx="13" cy="4" r="0.6" fill="#45901A" />
